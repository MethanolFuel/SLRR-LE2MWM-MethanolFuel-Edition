name: corpus

# Runs the same test suite against the real game content in this repository
# (every shipped .rpk, cfg and binary file), failing if the content is not found.
# Tests locate the content via $SLRR_GAME_ROOT or by walking up to the folder
# containing both Slrr.sln and sl.rpk; they otherwise pass vacuously.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "Directory.Build.props"
      - ".github/workflows/corpus.yml"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLRR_GAME_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
      - name: Verify game content is present
        shell: bash
        run: |
          test -f "$SLRR_GAME_ROOT/sl.rpk" || { echo "sl.rpk not found in $SLRR_GAME_ROOT; corpus tests would pass vacuously"; exit 1; }
          echo "rpk archives: $(find "$SLRR_GAME_ROOT" -maxdepth 1 -name '*.rpk' | wc -l)"
      - run: dotnet restore Slrr.sln
      - run: dotnet build Slrr.sln --no-restore --configuration Release -warnaserror
      - name: Corpus tests
        run: >
          dotnet test Slrr.sln --no-build --configuration Release
          --logger "trx;LogFileName=corpus-results.trx"
          --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
